<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        id="paper-assistant-window" title="论文翻译与对比方法解释"
        width="1280" height="850" persist="width height">
  <browser id="paper-assistant-browser" type="content" flex="1"
           src="chrome://paper-assistant/content/assistant.html"/>
  <script><![CDATA[
    const browser = document.getElementById("paper-assistant-browser");
    browser.addEventListener("load", () => {
      try { browser.contentWindow.wrappedJSObject.paperAssistantAPI = window.arguments?.[0]; } catch (e) {}
    }, { once: true });
  ]]></script>
</window>
